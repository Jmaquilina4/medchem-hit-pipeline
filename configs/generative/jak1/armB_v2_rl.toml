# ARM B of gate G3: reinforcement learning against the SAME scoring function used in arm A.
#
# Budget is MATCHED to arm A on purpose: arm A drew 20,000 samples (7,554 unique valid). Here
# batch_size 128 x 160 steps = 20,480 evaluations. Any quality difference is then attributable to the
# optimisation, not to having looked at more molecules.
#
# The scoring block below is generated from scoring.toml so the two arms cannot silently diverge.
#
# diversity_filter is on (IdenticalMurckoScaffold, bucket 25): without it RL collapses onto whichever
# scaffold it first finds rewarding, which is the classic failure mode and would make the comparison
# meaningless.

run_type = "staged_learning"
device = "cpu"
tb_logdir = "tb_logs_armB_v2"
json_out_config = "_armB_v2.json"

[parameters]
summary_csv_prefix = "armB_v2"
use_checkpoint = false
purge_memories = false
prior_file = "${REPO}/external/REINVENT4/priors/libinvent.prior"
agent_file = "${REPO}/external/REINVENT4/priors/libinvent.prior"
smiles_file = "scaffolds.smi"
batch_size = 128
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4
penalty_multiplier = 0.5

[[stage]]
chkpt_file = "armB_v2.chkpt"
termination = "simple"
max_score = 1.0        # capped at 1 by the schema; min_steps == max_steps forces the full budget
min_steps = 160
max_steps = 160

[stage.scoring]
type = "geometric_mean"

# ---------------------------------------------------------------------------------------------------
# Our own models, via one subprocess. Everything else below is a native component running in microseconds;
# this exists only for signals REINVENT cannot supply.
# ---------------------------------------------------------------------------------------------------
[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]

[[stage.scoring.component.ExternalProcess.endpoint]]
name = "QSAR potency floor"
weight = 3
params.executable = "${REPO}/.venv/bin/python"
params.args = "${REPO}/scripts/reinvent_oracle.py --config ${REPO}/configs/jak1.yaml"
params.property = "qsar_pic50"
transform.type = "sigmoid"
transform.high = 8.0
transform.low = 6.5
transform.k = 0.8

[[stage.scoring.component.ExternalProcess.endpoint]]
name = "Applicability-domain band (edge of domain, not inside it)"
weight = 3
params.executable = "${REPO}/.venv/bin/python"
params.args = "${REPO}/scripts/reinvent_oracle.py --config ${REPO}/configs/jak1.yaml"
params.property = "sim_to_train"
transform.type = "double_sigmoid"
transform.high = 0.55
transform.low = 0.35
transform.coef_div = 0.55
transform.coef_si = 40.0
transform.coef_se = 40.0

[[stage.scoring.component.ExternalProcess.endpoint]]
name = "Known-reference similarity alert"
weight = 2
params.executable = "${REPO}/.venv/bin/python"
params.args = "${REPO}/scripts/reinvent_oracle.py --config ${REPO}/configs/jak1.yaml"
params.property = "sim_to_known_reference"
transform.type = "reverse_sigmoid"
transform.high = 0.60
transform.low = 0.30
transform.k = 0.5

# ---------------------------------------------------------------------------------------------------
# Shape / flatness. The measured deficiency: the docking cascade drifted to Fsp3 0.16-0.23 against
# 0.47-0.57 for the approved drugs, because docking rewards buried aromatic surface. Weighted heavily
# because the unconditioned prior does NOT fix this on its own.
# ---------------------------------------------------------------------------------------------------
[[stage.scoring.component]]
[stage.scoring.component.Csp3]
[[stage.scoring.component.Csp3.endpoint]]
# v2 FIX: was a one-sided sigmoid, which is why v1 overshot. A one-sided reward on a property that has
# an OPTIMUM rather than a direction tells the optimiser "more is always better" -- and RL, being better
# at optimising than random sampling, overshot harder (Fsp3 0.697 vs 0.607 vs the drug reference 0.479).
# Same class of error as treating applicability domain as a floor instead of a band. Now a band centred
# on the approved-drug range (0.471-0.571, mean 0.479).
name = "Fraction sp3 carbon (3-dimensionality)"
weight = 3
transform.type = "double_sigmoid"
transform.high = 0.60
transform.low = 0.35
transform.coef_div = 0.60
transform.coef_si = 40.0
transform.coef_se = 40.0

[[stage.scoring.component]]
[stage.scoring.component.NumAromaticRings]
[[stage.scoring.component.NumAromaticRings.endpoint]]
name = "Aromatic ring count (flatness from another angle)"
weight = 1
transform.type = "step"
transform.high = 3
transform.low = 0

# ---------------------------------------------------------------------------------------------------
# Lead-like property space. Bands, not maxima -- these are constraints we want satisfied, not optimised.
# ---------------------------------------------------------------------------------------------------
[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular weight"
weight = 2
transform.type = "double_sigmoid"
transform.high = 450.0
transform.low = 300.0
transform.coef_div = 450.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.SlogP]
[[stage.scoring.component.SlogP.endpoint]]
name = "cLogP"
weight = 2
transform.type = "double_sigmoid"
transform.high = 4.0
transform.low = 1.0
transform.coef_div = 4.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.TPSA]
[[stage.scoring.component.TPSA.endpoint]]
name = "TPSA"
weight = 1
transform.type = "double_sigmoid"
transform.high = 120.0
transform.low = 40.0
transform.coef_div = 120.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 1
transform.type = "sigmoid"
transform.high = 0.85
transform.low = 0.45
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.NumRotBond]
[[stage.scoring.component.NumRotBond.endpoint]]
name = "Rotatable bonds"
weight = 1
transform.type = "step"
transform.high = 6
transform.low = 0

[[stage.scoring.component]]
[stage.scoring.component.HBondDonors]
[[stage.scoring.component.HBondDonors.endpoint]]
name = "H-bond donors"
weight = 1
transform.type = "step"
transform.high = 3
transform.low = 0

# ---------------------------------------------------------------------------------------------------
# Multiplicative penalties. These are applied after aggregation, so they are hard vetoes rather than
# tradeable components.
# ---------------------------------------------------------------------------------------------------
[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Structural alerts"
params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]",             # macrocycles
    "[#8][#8]", "[#16][#16]",                  # peroxides, disulfides
    "[#7;!n][#7;!n]",                          # hydrazines
    "[#6;!c][#7;!n]=[#7;!n]",                  # diazo
    "[#16][#6](=[#16])",                       # dithiocarbonyl
    "[#7]#[#6]-[#6]#[#7]",                     # malononitrile-like
    "[#6]=[#6]-[#6]=[O]",                      # Michael acceptor (enone)
]

# The pyrrolo[2,3-d]pyrimidine hinge binder must survive. LibInvent guarantees this structurally
# (324/324 in round 1), so this component should always score 1.0 -- it is here to make the invariant
# explicit in the config rather than implicit in the tool's behaviour, and to catch it loudly if a
# future scaffold edit breaks it.
[[stage.scoring.component]]
[stage.scoring.component.MatchingSubstructure]
[[stage.scoring.component.MatchingSubstructure.endpoint]]
name = "Hinge binder retained"
weight = 1
params.smarts = ["c1ncnc2[nH]ccc12"]
params.use_chirality = false

# NOTE: ${REPO} placeholders must be substituted for the repository root before use;
# see configs/generative/jak1/README.md. The committed form is deliberately
# path-independent so it does not encode one machine's layout.
